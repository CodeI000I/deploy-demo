replicaCount: 1

image:
  repository: REPLACE_WITH_DOCKERHUB_USERNAME/deploy-demo
  tag: "dev"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

ingress:
  enabled: true
  className: traefik
  host: demo.devgit.net
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  tls:
    secretName: demo-devgit-net-tls

middleware:
  redirectHttps:
    enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s