name: CI-CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-demo-main
  cancel-in-progress: true

env:
  APP_NAME: deploy-demo
  CHART_PATH: ./helm
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/deploy-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test-and-validate:
    name: Test and validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint "$CHART_PATH"

      - name: Render Helm templates
        run: |
          helm template "$APP_NAME" "$CHART_PATH" \
            --namespace demo \
            --set image.repository="$IMAGE_NAME" \
            --set image.tag="$IMAGE_TAG" \
            > rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-${{ github.sha }}
          path: rendered-manifests.yaml
          retention-days: 7

  build-and-push:
    name: Build and publish Docker image
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}